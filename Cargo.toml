[package]
name = "command-extra"
description = "Additional methods for std::process::Command"
version = "1.4.1"
authors = ["khai96_ <hvksmr1996@gmail.com>"]
license = "MIT"
edition = "2018"
readme = "README.md"
documentation = "https://docs.rs/command-extra"
repository = "https://github.com/KSXGitHub/command-extra.git"
keywords = [
  "process",
  "subprocess",
  "utility-trait",
]
include = [
  "/src",
  "/Cargo.toml",
  "/README.md",
  "/LICENSE.md",
]

[features]
default = []
async_process = ["async-process"]
tokio_process = ["tokio/process"]

[dependencies]
async-process = { version = "2.5.0", optional = true }
tokio = { version = "1.53.1", optional = true }

[package.metadata.docs.rs]
all-features = true
